[project]
name = "cpsc-qft"
version = "0.2.0"
description = "Conservation-Preserving Scattering Compiler research scaffold"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "LicenseRef-CPSC-ESCL-1.0 OR AGPL-3.0-only" }
authors = [{ name = "Ahmad Ali Parr" }]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
cpsc-demo = "cpsc.demo:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
